# Nginx reverse proxy untuk grezz.speakmi.com
# Copy ke /etc/nginx/sites-available/grezz.speakmi.com
# lalu: sudo ln -s /etc/nginx/sites-available/grezz.speakmi.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name grezz.speakmi.com;

    # Certbot akan otomatis menambah blok 443 + redirect di sini
    # setelah kamu jalankan: sudo certbot --nginx -d grezz.speakmi.com

    location /static/ {
        alias /var/www/grezz-app/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
}
